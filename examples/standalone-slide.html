<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>A self-contained HTML slide</title>
<style>
  body { margin: 0; width: 1280px; height: 720px; background: #fff7e6; font-family: system-ui, sans-serif; color: #1d1a14; position: relative; }
  h1 { position: absolute; left: 100px; top: 200px; margin: 0; font-size: 100px; line-height: 1; letter-spacing: -.04em; width: 800px; }
  h1 span { color: #d9482b; }
  p { position: absolute; left: 100px; top: 470px; margin: 0; font-size: 34px; width: 760px; color: #5b5648; }
  .dot { position: absolute; right: 120px; top: 140px; width: 260px; height: 260px; border-radius: 50%; background: #d9482b; }
</style>
</head>
<body>
  <div class="dot"></div>
  <h1>Open this file in <span>SlideClark</span></h1>
  <p>Drop it onto the editor (Open, then choose the file). One page becomes one editable slide.</p>
</body>
</html>
